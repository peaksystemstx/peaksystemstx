name: Deploy preview to GitHub Pages

# Publishes a *preview* copy of the site to GitHub Pages. This is NOT the live
# site — the real one is on Netlify at peaksystemstx.com (see README.md). The
# preview carries a "Preview only" banner and a noindex/disallow robots setup
# so it can't be mistaken for, or compete in search with, the real site.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Standard permissions for the deploy-pages action.
permissions:
  contents: read
  pages: write
  id-token: write

# One preview deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build preview copy
        run: bash .github/scripts/build-preview.sh site _preview
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _preview

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
